<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>X Ad Hider 设置</title>
    <link rel="stylesheet" href="../shared/ui.css">
  </head>
  <body>
    <main class="page-shell stack">
      <header class="topbar">
        <div>
          <h1>X Ad Hider 设置</h1>
          <div class="muted">正文或用户名命中后只在本地隐藏推文和回复。</div>
        </div>
      </header>

      <nav class="tabs" aria-label="设置分区">
        <button class="tab active" id="settingsTab" type="button" data-tab="settings" aria-pressed="true" aria-controls="settingsPanel">规则设置</button>
        <button class="tab" id="logsTab" type="button" data-tab="logs" aria-pressed="false" aria-controls="logsPanel">隐藏日志</button>
      </nav>

      <section class="section panel settings-panel" id="settingsPanel" aria-labelledby="settingsTab">
        <div class="section-heading">
          <h2>规则设置</h2>
          <label class="switch">
            <input type="checkbox" id="enabled">
            <span>启用扫描</span>
          </label>
        </div>

        <div class="rule-form">
          <div class="field">
            <label class="switch">
              <input type="checkbox" id="pinyinFuzzyMatching">
              <span>拼音模糊匹配</span>
            </label>
            <div class="muted field-hint">中文关键词按同拼音匹配；英文、数字和符号仍按原文匹配。</div>
          </div>

          <div class="field">
            <label for="keywords">正文关键词</label>
            <textarea id="keywords" spellcheck="false" placeholder="airdrop&#10;giveaway&#10;t.me/"></textarea>
            <div class="muted field-hint">每行一个，大小写不敏感。</div>
          </div>

          <div class="field">
            <label for="usernameKeywords">用户名关键词</label>
            <textarea id="usernameKeywords" spellcheck="false" placeholder="promo&#10;airdrop&#10;bot"></textarea>
            <div class="muted field-hint">匹配显示名或 @handle，每行一个。</div>
          </div>

          <div class="field">
            <label for="whitelist">白名单</label>
            <textarea id="whitelist" spellcheck="false" placeholder="@trusted_account"></textarea>
            <div class="muted field-hint">每行一个 handle，可带 @。</div>
          </div>
        </div>

        <div class="action-bar">
          <div class="actions">
            <button id="importSettings" type="button">导入设置</button>
            <button id="exportSettings" type="button">导出设置</button>
            <input type="file" id="importFile" accept="application/json,.json" hidden>
          </div>
          <div class="actions action-primary">
            <span class="muted notice" id="notice"></span>
            <button class="primary" id="save" type="button" disabled>保存全部设置</button>
          </div>
        </div>
      </section>

      <section class="section panel logs-panel" id="logsPanel" aria-labelledby="logsTab" hidden>
        <div class="section-heading">
          <h2>隐藏日志</h2>
          <button id="clearLogs" type="button">清空日志</button>
        </div>
        <div class="log-list" id="logs"></div>
      </section>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
